const dateShift=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};

// ===== DB 저장소: 모든 기능의 Firebase / localStorage 접근을 한곳에서 처리 =====
const DB={async put(k,obj){
  if(firebaseReady){
    try{
      const payload=k==='settings'?Object.fromEntries(Object.entries(obj).filter(([key])=>key!=='adminPin')):k==='votes'?Object.fromEntries(Object.entries(obj).filter(([key])=>key!=='voters')):obj;
      await fb.setDoc(fb.doc(fb.db,k,obj.id),payload);
      // onSnapshot 구독에서 모두의 화면이 갱신됩니다.
      return true;
    }catch(e){
      console.error('Firestore 저장 실패',k,e);
      throw Error(e.code==='permission-denied'?'Firestore 권한 오류: Authentication 로그인, users/{uid} 역할, 보안 규칙 게시 여부를 확인해 주세요.':('저장 실패: '+(e.message||e)));
    }
  }
  try{
    data[k]=[obj,...list(k).filter(x=>x.id!==obj.id)];
    saveLocal();
    render();
    return true;
  }catch(e){throw Error('이 기기에 저장하지 못했어요. 브라우저 저장 공간 또는 개인정보 보호 설정을 확인해 주세요. ('+e.message+')')}
},async remove(k,id){if(firebaseReady){try{await fb.deleteDoc(fb.doc(fb.db,k,id));return true}catch(e){toast('삭제 실패: '+e.message);return false}}data[k]=list(k).filter(x=>x.id!==id);saveLocal();render();return true},async comment(postId,content){if(firebaseReady){await fb.addDoc(fb.collection(fb.db,'posts',postId,'comments'),content)}else{let p=get('posts',postId);p.comments=[...(p.comments||[]),{...content,id:uid()}];saveLocal();render()}},async castVote(index){const v=get('votes','trip');if(!v)throw Error('투표를 찾지 못했습니다.');if(firebaseReady){let ballot=fb.doc(fb.db,'votes','trip','ballots',userId());let voteRef=fb.doc(fb.db,'votes','trip');await fb.runTransaction(fb.db,async tx=>{let seen=await tx.get(ballot);if(seen.exists())throw Error('이미 투표했어요.');let snap=await tx.get(voteRef);if(!snap.exists())throw Error('투표가 없습니다.');let x=snap.data();if(new Date()>new Date(x.end))throw Error('투표가 마감됐어요.');let counts=[...x.counts];counts[index]++;tx.update(voteRef,{counts});tx.set(ballot,{option:index,at:new Date().toISOString()})});sessionStorage.setItem('voted_trip','yes')}else{if(v.voters[userId()]!==undefined)throw Error('이미 투표했어요.');v.voters[userId()]=index;v.counts[index]++;saveLocal();render()}}};
async function initFirebase(){if(!hasConfig())return;try{const cfg=config();const [{initializeApp},{getFirestore,collection,doc,getDoc,onSnapshot,setDoc,deleteDoc,addDoc,runTransaction,updateDoc,increment},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js')]);const app=initializeApp(cfg);const db=getFirestore(app);fb={db,collection,doc,getDoc,onSnapshot,setDoc,deleteDoc,addDoc,runTransaction,updateDoc,increment,signInWithEmailAndPassword,signOut};fbauth=getAuth(app);firebaseReady=true;auth=null;localStorage.removeItem(KEYS.user);for(const k of ['notices','posts','votes','timetable','events','points','notes','settings']){unsubs.push(onSnapshot(collection(db,k),snap=>{data[k]=snap.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast(k+' 동기화 오류: '+e.message)))}onAuthStateChanged(fbauth,async u=>{if(!u){auth=null;sessionStorage.removeItem('voted_trip');render();return}const userRef=doc(db,'users',u.uid);if(window._classUserUnsub)window._classUserUnsub();window._classUserUnsub=onSnapshot(userRef,async s=>{const info=s.data();auth=info?{uid:u.uid,name:info.name,number:info.number,role:info.role}:null;render();try{let b=await fb.getDoc(fb.doc(fb.db,'votes','trip','ballots',u.uid));sessionStorage.setItem('voted_trip',b.exists()?'yes':'no');render()}catch{}})});render();toast('Firebase 실시간 연결을 시작했어요.')}catch(e){firebaseReady=false;toast('Firebase 연결 실패: '+e.message);render()}}
function render(){route=(location.hash.slice(1)||'home');const pages={home:'홈',page3:'게시판',page4:'투표',page5:'알리미',page6:'보상',page8:'한마디',page9:'할 일'};$('#nav').innerHTML=Object.entries(pages).map(([r,n])=>`<a href="#${r}" class="${route===r?'active':''}">${n}</a>`).join('');$('#account').innerHTML=auth?`<span class="small">${esc(auth.name)}님 ${isTeacher()?'🍀':''}</span><button class="button tiny secondary" data-act="logout">로그아웃</button>`:`<a class="button tiny" href="#page2">로그인</a>`;$('#status').innerHTML=firebaseReady?`<div class="statusbar" style="background:#1d3824;color:#d7f6cb"><div class="shell"><span>● Firebase 실시간 연결 (계정 인증 필요)</span><span class="small">${auth?'로그인됨':'로그인 후 참여할 수 있어요'} · <button class="button tiny secondary" data-act="switchdemo">체험 모드</button></span></div></div>`:`<div class="statusbar"><div class="shell"><span>⚠ 실시간 연동 전이라 이 기기에만 저장돼요</span><span class="row"><button class="button tiny secondary" data-act="switchlive">Firebase 연결 시도</button><button class="button tiny" data-act="firebase">Firebase 설정값 붙여 넣기</button></span></div></div>`;
const content={home:homePage,page2:loginPage,page3:boardPage,page4:votePage,page5:alertsPage,page6:pointsPage,page7:adminPage,page8:notesPage,page9:tasksPage};if(document.activeElement?.closest('#loginform, #noteform, #taskform, #voteform')){return}$('#app').innerHTML=(content[route]||homePage)();$('#nav').classList.remove('open');if(route==='page3'&&openPost&&firebaseReady)watchComments(openPost)}

function loginPage(){return `${pageHead('5-6학년 로그인','우리 반 활동을 함께해요.')}<div class="panel loginbox"><div class="tabs" role="tablist"><button class="${loginRole==='student'?'selected':''}" data-act="role" data-role="student">학생</button><button class="${loginRole==='teacher'?'selected':''}" data-act="role" data-role="teacher">선생님</button></div><p class="muted small">${firebaseReady?'Firebase Authentication에서 만든 계정으로 로그인합니다. 먼저 콘솔의 사용자 추가로 이메일·비밀번호를 등록하고, Firestore users/{uid}에 name·number·role 필드를 추가해 주세요.':'지금은 이 기기에서만 작동하는 체험용 로그인입니다.'}</p><form id="loginform" class="form"><div class="field"><label>번호</label><input name="number" maxlength="12" placeholder="예: 01" required><div class="err" id="loginerr"></div></div><div class="field"><label>이름</label><input name="name" maxlength="20" placeholder="예: 김하늘" required></div>${firebaseReady?`<div class="field"><label>이메일</label><input type="email" name="email" maxlength="120" placeholder="student1@myclass.com" required></div><div class="field"><label>비밀번호</label><input type="password" name="password" minlength="6" maxlength="128" required></div>`:''}<p class="authnote">※ 실제 비밀번호를 쓰지 마세요. 학급 전용 연습 계정을 사용하세요. Firebase 연결 전에는 화면 위쪽의 ‘체험 모드’에서 로그인·게시판을 연습할 수 있습니다.</p><button class="button" type="submit">로그인</button></form></div>`}

function boardPage(){if(openPost){let p=get('posts',openPost);if(!p||p.hidden&&!isTeacher())openPost=null;else return postDetail(p)}let ps=visiblePosts(),max=Math.max(1,Math.ceil(ps.length/10));postPage=Math.min(max,postPage);let items=ps.slice((postPage-1)*10,postPage*10);return `${pageHead('자유 게시판','서로의 생각을 자유롭게 나눠요.',permitted('posts')?`<button class="button" data-act="writepost">＋ 글쓰기</button>`:'<a class="button" href="#page2">로그인하고 글쓰기</a>')}<div class="panel"><div class="table-scroll"><table><thead><tr><th>번호</th><th>제목</th><th>작성자</th><th>날짜</th><th>댓글</th><th>좋아요</th></tr></thead><tbody>${items.map((p,i)=>`<tr><td>${ps.length-((postPage-1)*10+i)}</td><td class="clickable" data-act="viewpost" data-id="${p.id}">${esc(p.title)} ${p.hidden?'<span class="tag">숨김</span>':''}</td><td>${esc(p.author)}</td><td>${esc(p.date||'')}</td><td>${p.commentCount??p.comments?.length??0}</td><td>♥ ${(p.likes||[]).length}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">아직 등록된 글이 없어요.</td></tr>'}</tbody></table></div><div class="pagination">${Array.from({length:max},(_,i)=>`<button data-act="postpage" data-page="${i+1}" class="${i+1===postPage?'sel':''}">${i+1}</button>`).join('')}</div></div>`}
function postDetail(p){let own=auth&&(p.owner===userId()||isTeacher()),liked=(p.likes||[]).includes(userId());return `${pageHead('자유 게시판')}<div class="postdetail"><button class="button secondary tiny" data-act="backposts">← 목록으로</button><div class="panel" style="margin-top:14px"><h2>${esc(p.title)}</h2><p class="meta">${esc(p.author)} · ${esc(p.date||'')}</p><div class="divider"></div><p style="white-space:pre-wrap;min-height:100px">${esc(p.body)}</p><div class="row between"><button class="button ${liked?'':'secondary'} tiny" data-act="like" data-id="${p.id}" ${!auth?'disabled':''}>♥ 좋아요 ${(p.likes||[]).length}</button><div class="row">${own?`<button class="button secondary tiny" data-act="editpost" data-id="${p.id}">수정</button><button class="button danger tiny" data-act="delpost" data-id="${p.id}">삭제</button>`:''}</div></div></div><section class="panel section"><h3>댓글 <span id="commentcount">${p.commentCount??p.comments?.length??0}</span></h3><div id="comments">${(p.comments||[]).map(c=>commentHTML(c)).join('')||'<p class="muted">첫 댓글을 남겨 보세요.</p>'}</div>${permitted('posts')?`<form id="commentform" class="form" data-id="${p.id}"><textarea maxlength="500" name="body" placeholder="따뜻한 댓글을 남겨 주세요."></textarea><div class="err" id="commenterr"></div><button class="button">댓글 등록</button></form>`:'<p class="muted">로그인하면 댓글을 남길 수 있어요.</p>'}</section></div>`}

let commentUnsub=null;function watchComments(pid){if(commentUnsub){commentUnsub();commentUnsub=null}if(!firebaseReady)return;commentUnsub=fb.onSnapshot(fb.collection(fb.db,'posts',pid,'comments'),snap=>{if(openPost!==pid||route!=='page3')return;let cs=snap.docs.map(d=>d.data());let el=$('#comments');if(el)el.innerHTML=cs.map(commentHTML).join('')||'<p class="muted">첫 댓글을 남겨 보세요.</p>';let cc=$('#commentcount');if(cc)cc.textContent=cs.length})}
function votePage(){let v=get('votes','trip');if(!v)return `${pageHead('투표')}<div class="panel empty">투표 정보를 불러오는 중입니다.</div>`;let voted=firebaseReady?sessionStorage.getItem('voted_trip')==='yes':v.voters[userId()]!==undefined;let ended=new Date()>new Date(v.end);let total=v.counts.reduce((a,b)=>a+b,0);return `${pageHead('투표','우리 반의 중요한 일을 직접 결정해요.') }<div class="panel" style="max-width:770px;margin:auto"><div class="tag">학급 투표</div><h2>${esc(v.question)}</h2><p class="muted small">마감: ${dateKorean((v.end||'2026-11-14').slice(0,10))}까지 ${ended?' · 마감됨':''}</p>${!voted?`<form id="voteform" class="form">${v.options.map((o,i)=>`<label class="polloption"><input type="radio" name="choice" value="${i}">${esc(o)}</label>`).join('')}<div class="err" id="voteerr"></div><button class="button" ${!auth||ended?'disabled':''}>투표하기</button></form>${!auth?'<p class="authnote">투표하려면 로그인하세요.</p>':''}`:`<p class="tag">✓ 투표를 완료했어요</p>`}${voted&&v.showResults!==false?`<div class="divider"></div><h3>투표 결과 · 총 ${total}표</h3>${v.options.map((o,i)=>`<div class="pollresult"><div class="row between"><span>${esc(o)}</span><strong>${total?Math.round(v.counts[i]/total*100):0}% · ${v.counts[i]}표</strong></div><div class="meter"><span style="width:${total?v.counts[i]/total*100:0}%"></span></div></div>`).join('')}`:''}<p class="small muted">투표 선택은 학급 사용자 화면에 공개되지 않습니다. 운영자 수준의 완전한 익명성과 집계 보호에는 서버 측 검증이 추가로 필요합니다.</p></div>`}

function calendarWidget(){const y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),evs=list('events');let cells=Array.from({length:Math.ceil((start+days)/7)*7},(_,i)=>{let n=i-start+1;if(n<1||n>days)return `<button class="day" disabled></button>`;let d=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,events=evs.filter(e=>e.date===d);return `<button class="day ${new Date().toDateString()===new Date(y,m,n).toDateString()?'today':''} ${i%7===0?'sun':''} ${i%7===6?'sat':''}" data-act="day" data-date="${d}"><span class="num">${n}</span>${events.map(e=>`<span class="evtag">${esc(e.title)}</span>`).join('')}${events.length?'<span class="dot"></span>':''}</button>`}).join('');return `<section class="panel section"><div class="sectionhead"><h2>📅 학급 일정</h2><div class="row"><button class="button secondary tiny" data-act="monthprev">‹</button><strong>${y}년 ${m+1}월</strong><button class="button secondary tiny" data-act="monthnext">›</button></div></div>${permitted('events')?'<div style="margin-bottom:12px"><button class="button tiny" data-act="addevent">＋ 일정 추가</button></div>':''}<div class="calendar-grid">${['일','월','화','수','목','금','토'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></section>`}
function alertsPage(){return `${pageHead('알리미','수업과 일정을 한눈에 확인해요.')}${timetableWidget()}${calendarWidget()}`}
function pointsPage(){let arr=[...list('points')].sort((a,b)=>b.score-a.score);let max=Math.max(1,...arr.map(g=>g.score));return `${pageHead('학급 보상 점수','우리 반의 멋진 노력을 칭찬해요.')}<div class="panel"><div class="row between"><span class="tag">실시간 모둠 랭킹</span><span class="muted small">높은 점수 순</span></div><div style="margin-top:12px">${arr.map((g,i)=>`<div class="rankrow"><span style="font-size:21px">${['🥇','🥈','🥉'][i]||i+1}</span><strong>${esc(g.name)}</strong><div class="meter"><span style="width:${Math.max(0,g.score)/max*100}%"></span></div><span class="points">${g.score}</span><div class="row rankbuttons">${permitted('points')?`<button class="button tiny secondary" data-act="score" data-id="${g.id}" data-delta="-1">−1</button><button class="button tiny" data-act="score" data-id="${g.id}" data-delta="1">+1</button>`:''}</div></div>`).join('')}</div></div>`}
function notesPage(){let cs=['#e5f1b8','#e1d8ff','#ffd8ba','#cdebf4','#ffd3dd'];return `${pageHead('우리 반 한마디','짧고 따뜻한 메시지를 남겨요.')}<section class="panel"><form id="noteform" class="form"><div class="field"><label>오늘 전하고 싶은 한마디</label><textarea name="body" maxlength="100" placeholder="100자 이내로 적어 주세요." required></textarea><div class="err" id="noteerr"></div></div><button class="button" style="align-self:flex-start">✎ 남기기</button></form></section><div class="section notegrid">${list('notes').filter(n=>!n.hidden||isTeacher()).map(n=>`<div class="sticky" style="background:${cs[n.color%cs.length]}"><p>${esc(n.body)}</p><div class="row between"><span class="small">✦ ${esc(n.author)}</span>${((auth&&n.owner===userId())||isTeacher()||(!firebaseReady&&n.owner===userId()))?`<button class="button tiny secondary" style="color:#f8f8f8" data-act="delnote" data-id="${n.id}">삭제</button>`:''}</div></div>`).join('')}</div>`}
function tasksPage(){let done=tasks.filter(t=>t.done).length,total=tasks.length;return `${pageHead('오늘 할 일','하나씩 체크하며 성취감을 쌓아 봐요.')}<div class="panel" style="max-width:780px;margin:auto">${tasks.map(t=>`<div class="task"><input type="checkbox" data-act="taskcheck" data-id="${t.id}" ${t.done?'checked':''}><span class="${t.done?'done':''}">${esc(t.text)}</span><button class="button tiny secondary delete" data-act="taskdel" data-id="${t.id}">삭제</button></div>`).join('')||'<p class="empty">새로운 할 일을 추가해 보세요.</p>'}<form id="taskform" class="row" style="margin:23px 0"><input name="text" placeholder="새 할 일 입력 (60자 이내)" maxlength="60" required><button class="button">추가</button></form><div class="row between"><strong>진행률</strong><span>${done} / ${total} 완료</span></div><div class="meter" style="margin-top:9px"><span style="width:${total?done/total*100:0}%"></span></div>${total&&done===total?'<p class="center" style="font-size:21px;color:var(--lime)">🎉 모든 할 일을 마쳤어요! 정말 멋져요!</p>':''}<p class="muted small">이 할 일 목록은 지금 사용하는 기기에만 저장됩니다.</p></div>`}
function adminPage(){if(firebaseReady&&!isTeacher())return `${pageHead('관리자 페이지')}<div class="panel loginbox center"><h2>🔒 선생님 전용</h2><p class="muted">Firebase 실시간 모드에서는 선생님 계정으로 로그인해야 합니다.</p><a class="button" href="#page2">로그인하기</a></div>`;if(!adminUnlocked&&!firebaseReady)return `${pageHead('관리자 페이지')}<div class="panel loginbox"><h2>🔒 관리자 잠금</h2><p class="muted small">연습용 잠금입니다. 실제 접근 권한은 선생님 계정과 Firestore 보안 규칙으로 보호해야 합니다.</p><form id="adminlogin" class="form"><div class="field"><label>연습용 관리자 비밀번호</label><input type="password" name="pin" maxlength="30" placeholder="처음 비밀번호: 0000"><div class="err" id="adminerr"></div></div><button class="button">관리자 입장</button></form></div>`;let perms=settings().permissions;const keys={posts:'게시판',votes:'투표',notices:'알림장',timetable:'시간표',events:'학급 일정',points:'칭찬 점수',notes:'한마디'};return `${pageHead('관리자 페이지','권한과 게시물을 한곳에서 관리해요.',`<button class="button secondary" data-act="exitadmin">관리자 나가기</button>`)}<div class="grid2"><section class="panel"><h2>🔑 기능별 권한</h2><p class="muted small">변경 즉시 적용됩니다. Firestore 규칙도 같은 권한을 지원하도록 배포해야 합니다.</p>${Object.entries(keys).map(([k,t])=>`<div class="settingsrow"><strong>${t}</strong><select data-act="perm" data-key="${k}">${[['any','누구나'],['login','로그인한 사람'],['teacher','선생님만']].map(([v,label])=>`<option value="${v}" ${perms[k]===v?'selected':''}>${label}</option>`).join('')}</select></div>`).join('')}</section><section class="panel"><h2>🛡 관리자 안내</h2><p class="muted">실제 관리자 권한은 Firebase <strong>users/{uid}.role = teacher</strong>에서 확인합니다. 초기 비밀번호 0000은 로컬 연습용이며 Firebase에서는 PIN을 사용하지 않습니다.</p><form id="pinform" class="form" style="${firebaseReady?'display:none':''}"><div class="field"><label>연습용 비밀번호 변경</label><input name="pin" type="password" minlength="4" maxlength="30" placeholder="새 비밀번호"></div><div class="err" id="pinerr"></div><button class="button">변경</button></form><div class="divider"></div><button class="button secondary" data-act="rules">Firestore 보안 규칙 예시 보기</button>${firebaseReady?'<button class="button" style="margin-top:10px" data-act="seed">샘플 데이터 넣기</button>':''}</section></div><section class="panel section"><h2>🗃 글 관리</h2>${[...list('posts').map(p=>({...p,_type:'posts'})),...list('notes').map(n=>({...n,_type:'notes'}))].sort((a,b)=>String(b.createdAt||b.date||b.id).localeCompare(String(a.createdAt||a.date||a.id))).map(x=>`<div class="row between" style="padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap"><div><span class="tag">${x._type==='posts'?'게시판':'한마디'}</span> <strong>${esc(x.title||x.body.slice(0,35))}</strong><div class="muted small">${esc(x.author)} ${x.hidden?'· 숨김':''}</div></div><div class="row"><button class="button tiny secondary" data-act="hide" data-type="${x._type}" data-id="${x.id}">${x.hidden?'공개':'숨기기'}</button><button class="button tiny danger" data-act="adminremove" data-type="${x._type}" data-id="${x.id}">삭제</button></div></div>`).join('')||'<p class="muted">관리할 글이 없습니다.</p>'}</section>`}
const rulesText="rules_version = '2';\nservice cloud.firestore {\n match /databases/{database}/documents {\n  function signed() { return request.auth != null; }\n  function me() { return request.auth.uid; }\n  function teacher() {\n   return signed() && get(/databases/$(database)/documents/users/$(me())).data.role == 'teacher';\n  }\n  function allowed(feature) {\n   let p = get(/databases/$(database)/documents/settings/main).data.permissions[feature];\n   return p == 'any' || (p == 'login' && signed()) || (p == 'teacher' && teacher());\n  }\n  match /users/{uid} {\n   allow get: if signed() && (me() == uid || teacher());\n   allow list: if teacher();\n   allow create: if signed() && me() == uid && request.resource.data.role == 'student';\n   allow update: if teacher() || (signed() && me() == uid && request.resource.data.role == resource.data.role);\n   allow delete: if teacher();\n  }\n  match /settings/{id} { allow read: if true; allow write: if teacher(); }\n  match /notices/{id} {\n   allow read: if true;\n   allow create,delete: if teacher();\n   allow update: if teacher() || (signed() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['checked']) && request.resource.data.checked.size() == resource.data.checked.size() + 1 && request.resource.data.checked.hasAll(resource.data.checked) && request.resource.data.checked.hasAny([me()]));\n  }\n  match /timetable/{id} { allow read: if true; allow write: if teacher(); }\n  match /events/{id} { allow read: if true; allow write: if teacher(); }\n  match /points/{id} { allow read: if true; allow write: if teacher(); }\n  match /posts/{id} {\n   allow read: if true;\n   allow create: if teacher() || (signed() && allowed('posts') && request.resource.data.owner == me());\n   allow update: if teacher() || (signed() && (\n     (resource.data.owner == me() && request.resource.data.owner == resource.data.owner) ||\n     (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['likes']) && !(me() in resource.data.likes) && request.resource.data.likes.size() == resource.data.likes.size()+1 && request.resource.data.likes.hasAll(resource.data.likes) && me() in request.resource.data.likes) ||\n     (request.resource.data.diff(resource.data).affectedKeys().hasOnly(['commentCount']) && request.resource.data.commentCount == resource.data.commentCount+1)\n   ));\n   allow delete: if teacher() || (signed() && resource.data.owner == me());\n   match /comments/{cid} {\n    allow read: if true;\n    allow create: if signed() && allowed('posts') && request.resource.data.owner == me();\n    allow update,delete: if teacher() || (signed() && resource.data.owner == me());\n   }\n  }\n  match /notes/{id} {\n   allow read: if true;\n   allow create: if allowed('notes') && request.resource.data.body is string && request.resource.data.body.size() <= 100;\n   allow update,delete: if teacher() || (signed() && resource.data.owner == me());\n  }\n  match /votes/{id} {\n   allow read: if true;\n   allow create,delete: if teacher();\n   allow update: if teacher() || (signed() && allowed('votes') &&\n      request.resource.data.diff(resource.data).affectedKeys().hasOnly(['counts']) &&\n      request.resource.data.counts.size() == 4 && resource.data.counts.size() == 4 &&\n      !exists(/databases/$(database)/documents/votes/$(id)/ballots/$(me())) &&\n      existsAfter(/databases/$(database)/documents/votes/$(id)/ballots/$(me())) &&\n      request.resource.data.counts[0] == resource.data.counts[0] + (getAfter(/databases/$(database)/documents/votes/$(id)/ballots/$(me())).data.option == 0 ? 1 : 0) &&\n      request.resource.data.counts[1] == resource.data.counts[1] + (getAfter(/databases/$(database)/documents/votes/$(id)/ballots/$(me())).data.option == 1 ? 1 : 0) &&\n      request.resource.data.counts[2] == resource.data.counts[2] + (getAfter(/databases/$(database)/documents/votes/$(id)/ballots/$(me())).data.option == 2 ? 1 : 0) &&\n      request.resource.data.counts[3] == resource.data.counts[3] + (getAfter(/databases/$(database)/documents/votes/$(id)/ballots/$(me())).data.option == 3 ? 1 : 0));\n   match /ballots/{uid} {\n    allow get: if signed() && me() == uid;\n    allow list: if false;\n    allow create: if signed() && me() == uid && allowed('votes') && request.resource.data.option is int && request.resource.data.option >= 0 && request.resource.data.option < 4 && !exists(/databases/$(database)/documents/votes/$(id)/ballots/$(uid));\n    allow update,delete: if false;\n   }\n  }\n }\n}\n";
function openEditorPost(p){let edit=!!p;showModal(edit?'글 수정':'새 글쓰기',`<form id="postform" class="form"><input type="hidden" name="id" value="${p?p.id:''}"><div class="field"><label>제목 (60자 이내)</label><input name="title" maxlength="60" value="${esc(p?.title||'')}" required></div><div class="field"><label>내용 (2000자 이내)</label><textarea name="body" maxlength="2000" required>${esc(p?.body||'')}</textarea><div class="err" id="posterr"></div></div><button class="button" type="submit">${edit?'수정 저장':'글 저장'}</button></form>`)}
function openEditorNotice(){let n=get('notices',noticeCursor);showModal('알림장 편집',`<form id="noticeform" class="form"><div class="field"><label>날짜</label><input name="date" type="date" value="${noticeCursor}" required></div><div class="field"><label>항목 (한 줄에 하나씩)</label><textarea name="items" maxlength="1800" required>${esc(n?.items.join('\n')||'')}</textarea><div class="err" id="noticeerr"></div></div><button class="button">알림장 저장</button></form>`)}
function openEvent(date){let es=list('events').filter(x=>x.date===date);showModal(dateKorean(date),`<div class="stack">${es.map(e=>`<div class="row between"><strong>🗓 ${esc(e.title)}</strong>${permitted('events')?`<button class="button tiny danger" data-act="delevent" data-id="${e.id}">삭제</button>`:''}</div>`).join('')||'<p class="muted">등록된 일정이 없어요.</p>'}${permitted('events')?`<button class="button" data-act="addevent" data-date="${date}">＋ 일정 추가</button>`:''}</div>`)}
function openEventForm(date){showModal('학급 일정 추가',`<form id="eventform" class="form"><div class="field"><label>날짜</label><input name="date" type="date" value="${date||iso()}" required></div><div class="field"><label>일정 제목</label><input name="title" maxlength="70" required></div><div class="err" id="eventerr"></div><button class="button">일정 저장</button></form>`)}
function fbModal(){const raw=JSON.stringify(config(),null,2);showModal('Firebase 설정값 붙여 넣기',`<p class="muted small">Firebase 콘솔에서 복사한 <strong>firebaseConfig = { ... }</strong> 객체 또는 JSON을 붙여 넣어 주세요. 설정값은 이 기기의 브라우저에 저장됩니다.</p><form id="fbform" class="form"><textarea name="config" style="min-height:190px;font-family:monospace;font-size:12px" spellcheck="false">${esc(raw)}</textarea><div class="err" id="fberr"></div><button class="button">설정 저장하고 연결하기</button></form>`)}
function parseConfig(s){let m=s.match(/\{[\s\S]*\}/);if(!m)throw Error('설정 객체의 { } 부분을 넣어 주세요.');let t=m[0].replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g,'').replace(/([,{]\s*)([a-zA-Z][\w]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');const c=JSON.parse(t);if(!c.apiKey||!c.projectId||!c.appId)throw Error('apiKey, projectId, appId 값이 필요합니다.');return c}
function lockMsg(key){toast(`이 기능은 ${settings().permissions[key]==='teacher'?'선생님':settings().permissions[key]==='login'?'로그인한 사람':'허용된 사용자'}만 사용할 수 있어요.`)}
async function safe(fn){if(working)return;working=true;try{await fn()}catch(e){toast(e.message||String(e))}finally{working=false}}
window.addEventListener('hashchange',()=>{openPost=null;render();window.scrollTo(0,0)});$('#hamb').onclick=()=>$('#nav').classList.toggle('open');
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;switch(a){case 'closemodal':closeModal();break;case 'firebase':fbModal();break;case 'switchdemo':localStorage.setItem('class56_force_demo','yes');location.reload();break;case 'switchlive':localStorage.removeItem('class56_force_demo');location.reload();break;case 'role':loginRole=b.dataset.role;render();break;case 'logout':await safe(async()=>{if(firebaseReady){await fb.signOut(fbauth);sessionStorage.removeItem('voted_trip')}else{auth=null;localStorage.removeItem(KEYS.user)}render();toast('로그아웃했어요.')});break;case 'noticeprev':noticeCursor=dateShift(noticeCursor,-1);render();break;case 'noticenext':noticeCursor=dateShift(noticeCursor,1);render();break;case 'editnotice':permitted('notices')?openEditorNotice():lockMsg('notices');break;case 'confirmnotice':{let n=get('notices',noticeCursor);if(!auth){toast('로그인 후 확인할 수 있어요.');break}if(n&&!n.checked.includes(userId()))await safe(()=>DB.put('notices',{...n,checked:[...n.checked,userId()]}));break}case 'photo':showModal('최근 활동 사진 '+b.dataset.num,photo('최근 활동 사진 '+b.dataset.num));break;case 'writepost':permitted('posts')?openEditorPost():lockMsg('posts');break;case 'viewpost':openPost=id;render();break;case 'backposts':openPost=null;render();break;case 'postpage':postPage=+b.dataset.page;render();break;case 'like':{let p=get('posts',id);if(!auth){toast('로그인 후 좋아요를 누를 수 있어요.');break}if(p.likes?.includes(userId())){toast('이미 좋아요를 눌렀어요.');break}await safe(()=>DB.put('posts',{...p,likes:[...(p.likes||[]),userId()]}));break}case 'editpost':{let p=get('posts',id);if(p&&(p.owner===userId()||isTeacher()))openEditorPost(p);break}case 'delpost':confirmModal('이 글을 삭제할까요?',()=>safe(async()=>{await DB.remove('posts',id);openPost=null;render()}));break;case 'monthprev':month.setMonth(month.getMonth()-1);render();break;case 'monthnext':month.setMonth(month.getMonth()+1);render();break;case 'day':openEvent(b.dataset.date);break;case 'addevent':if(permitted('events'))openEventForm(b.dataset.date);break;case 'delevent':confirmModal('이 일정을 삭제할까요?',()=>safe(async()=>{await DB.remove('events',id);closeModal()}));break;case 'editclass':{if(!permitted('timetable'))break;const r=+b.dataset.row,c=+b.dataset.col;showModal('시간표 수정',`<form id="classform" data-row="${r}" data-col="${c}" class="form"><label>${['월','화','수','목','금'][c]}요일 ${r+1}교시</label><input name="subject" maxlength="15" value="${esc(get('timetable','main')?.rows[r][c]||'')}" placeholder="과목 (비우면 없음)"><button class="button">저장</button></form>`);break}case 'score':{if(!permitted('points'))break;let x=get('points',id);await safe(()=>DB.put('points',{...x,score:Math.max(0,x.score+ +b.dataset.delta)}));break}case 'delnote':confirmModal('이 쪽지를 삭제할까요?',()=>safe(()=>DB.remove('notes',id)));break;case 'taskcheck':{let t=tasks.find(x=>x.id===id);t.done=b.checked;localStorage.setItem(KEYS.tasks,JSON.stringify(tasks));render();break}case 'taskdel':confirmModal('이 할 일을 삭제할까요?',()=>{tasks=tasks.filter(x=>x.id!==id);localStorage.setItem(KEYS.tasks,JSON.stringify(tasks));render()});break;case 'exitadmin':adminUnlocked=false;sessionStorage.removeItem(KEYS.admin);render();break;case 'perm':break;case 'rules':showModal('Firestore 보안 규칙 예시',`<p class="authnote">이 규칙은 시작용입니다. 현재 HTML의 집계형 투표는 서버 집계가 없어 Firebase에서 투표 제출 시 권한 오류가 납니다. 안전한 익명 투표에는 Cloud Functions 등 서버 로직이 필요합니다.</p><pre id="adminrules">${esc(rulesText)}</pre><button class="button" data-act="copyrules">규칙 복사</button>`);break;case 'copyrules':navigator.clipboard.writeText(rulesText).then(()=>toast('규칙을 복사했어요.'));break;case 'seed':if(firebaseReady&&isTeacher())confirmModal('Firestore에 현재 없는 샘플 자료를 추가할까요?',()=>safe(async()=>{for(const k of ['settings','notices','posts','votes','timetable','events','points','notes']){for(const item of initial[k])if(!get(k,item.id)){const v={...item};if(k==='settings')delete v.adminPin;if(k==='votes')delete v.voters;await DB.put(k,v)}}toast('샘플 데이터 등록을 마쳤어요.')}));break;case 'hide':{let x=get(b.dataset.type,id);await safe(()=>DB.put(b.dataset.type,{...x,hidden:!x.hidden}));break}case 'adminremove':confirmModal('정말 삭제할까요?',()=>safe(()=>DB.remove(b.dataset.type,id)));break;}});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.act==='perm'&&adminUnlocked&&(!firebaseReady||isTeacher())){let s=settings();await safe(()=>DB.put('settings',{...s,permissions:{...s.permissions,[el.dataset.key]:el.value}}));toast('권한 설정을 변경했어요.')}});
document.addEventListener('submit',async e=>{let f=e.target;if(!f.id)return;e.preventDefault();const fd=new FormData(f),v=k=>String(fd.get(k)||'').trim(),error=(id,msg)=>{let el=$('#'+id);if(el)el.textContent=msg};switch(f.id){case 'fbform':try{const cfg=parseConfig(v('config'));localStorage.setItem(KEYS.config,JSON.stringify(cfg));closeModal();location.reload()}catch(ex){error('fberr',ex.message)}break;case 'loginform':{let name=v('name'),number=v('number');if(!name||!number){error('loginerr','번호와 이름을 모두 입력해 주세요.');break}if(firebaseReady){await safe(async()=>{let cred=await fb.signInWithEmailAndPassword(fbauth,v('email'),v('password'));let profile=(await fb.getDoc(fb.doc(fb.db,'users',cred.user.uid))).data();if(!profile){await fb.signOut(fbauth);throw Error('users 컬렉션에 계정 정보가 없습니다. 관리자에게 문의하세요.')}if(profile.role!==loginRole||profile.name!==name||String(profile.number)!==number){await fb.signOut(fbauth);throw Error('역할·번호·이름이 등록된 계정과 일치하지 않아요.')}auth={uid:cred.user.uid,name,number,role:profile.role};location.hash='#home';toast('로그인했어요.')})}else{auth={uid:`demo-${number}-${name}`,name,number,role:loginRole};localStorage.setItem(KEYS.user,JSON.stringify(auth));location.hash='#home';render();toast('체험용 로그인 완료!')}break}case 'postform':{
  const errorBox=$('#posterr');
  if(errorBox)errorBox.textContent='';
  if(!auth){error('posterr','로그인 후 글을 작성할 수 있어요.');break}
  if(!permitted('posts')){error('posterr','게시판 글쓰기 권한이 없습니다. 선생님께 문의해 주세요.');break}
  const title=v('title'),body=v('body'),id=v('id');
  if(!title||!body){error('posterr','제목과 내용을 모두 입력해 주세요.');break}
  if(title.length>60||body.length>2000){error('posterr','제목은 60자, 본문은 2000자 이내로 입력해 주세요.');break}
  const submitButton=f.querySelector('button[type="submit"],button:not([type])');
  if(submitButton){submitButton.disabled=true;submitButton.textContent='저장 중…'}
  try{
    const old=id?get('posts',id):null;
    if(id&&!old)throw Error('수정할 게시글을 찾지 못했어요.');
    if(old&&old.owner!==userId()&&!isTeacher())throw Error('내가 작성한 글만 수정할 수 있어요.');
    const newPost=old?{...old,title,body}:{id:uid(),title,body,author:auth.name,owner:userId(),date:iso(),createdAt:new Date().toISOString(),likes:[],comments:[],commentCount:0,hidden:false};
    const success=await DB.put('posts',newPost);
    if(success!==true)throw Error('게시글 저장에 실패했어요.');
    closeModal();openPost=null;postPage=1;render();toast(old?'게시글을 수정했어요.':'게시글이 추가됐어요!');
  }catch(ex){
    console.error('게시판 글쓰기 오류',ex);
    error('posterr',ex.message||'저장하지 못했어요. 다시 시도해 주세요.');
    toast('게시글 저장에 실패했어요. 오류 내용을 확인해 주세요.');
  }finally{
    if(submitButton?.isConnected){submitButton.disabled=false;submitButton.textContent=id?'수정 저장':'글 저장'}
  }
  break
}case 'commentform':{const body=v('body'),id=f.dataset.id;if(!body||body.length>500){error('commenterr','댓글은 1~500자로 입력해 주세요.');break}if(!permitted('posts')){lockMsg('posts');break}await safe(async()=>{await DB.comment(id,{body,author:auth.name,owner:userId(),date:iso()});if(firebaseReady){await fb.updateDoc(fb.doc(fb.db,'posts',id),{commentCount:fb.increment(1)})}f.reset();toast('댓글을 등록했어요.')});break}case 'voteform':{let idx=fd.get('choice');if(idx===null){error('voteerr','선택지를 하나 골라 주세요.');break}if(!auth){error('voteerr','로그인 후 투표할 수 있어요.');break}await safe(async()=>{await DB.castVote(Number(idx));render();toast('투표했어요!')});break}case 'noticeform':{if(!permitted('notices'))break;let date=v('date'),items=v('items').split('\n').map(x=>x.trim()).filter(Boolean);if(!date||!items.length){error('noticeerr','날짜와 알림장 내용을 입력해 주세요.');break}await safe(async()=>{let old=get('notices',date);await DB.put('notices',{id:date,date,items,checked:old?.checked||[]});noticeCursor=date;closeModal();render();toast('알림장을 저장했어요.')});break}case 'classform':{if(!permitted('timetable'))break;let r=+f.dataset.row,c=+f.dataset.col,x=get('timetable','main'),rows=x.rows.map(a=>[...a]);rows[r][c]=v('subject');await safe(async()=>{await DB.put('timetable',{id:'main',rows});closeModal();toast('시간표를 수정했어요.')});break}case 'eventform':{if(!permitted('events'))break;let date=v('date'),title=v('title');if(!date||!title){error('eventerr','날짜와 제목을 적어 주세요.');break}await safe(async()=>{await DB.put('events',{id:uid(),date,title});closeModal();toast('일정을 추가했어요.')});break}case 'noteform':{let body=v('body');if(!body||body.length>100){error('noteerr','한마디는 1~100자로 입력해 주세요.');break}if(!permitted('notes')){lockMsg('notes');break}await safe(async()=>{await DB.put('notes',{id:uid(),body,owner:userId(),author:auth?.name||'익명 친구',color:Math.floor(Math.random()*5),hidden:false,createdAt:new Date().toISOString()});f.reset();toast('한마디를 남겼어요.')});break}case 'taskform':{const text=v('text');if(!text||text.length>60){toast('할 일은 1~60자로 적어 주세요.');break}tasks.push({id:uid(),text,done:false});localStorage.setItem(KEYS.tasks,JSON.stringify(tasks));render();break}case 'adminlogin':{if(firebaseReady&&!isTeacher()){error('adminerr','선생님 계정만 사용할 수 있어요.');break}if(v('pin')!==settings().adminPin){error('adminerr','비밀번호가 일치하지 않아요.');break}adminUnlocked=true;sessionStorage.setItem(KEYS.admin,'yes');render();break}case 'pinform':{let pin=v('pin');if(pin.length<4){error('pinerr','비밀번호는 4자 이상으로 설정해 주세요.');break}await safe(async()=>{await DB.put('settings',{...settings(),adminPin:pin});toast('연습용 비밀번호를 바꿨어요.')});break}}});
render();initFirebase();
</script></body></html>
